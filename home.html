<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAGO DANA INSTAN</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f9;
  margin: 0;
}

.container {
  max-width: 420px;
  margin: auto;
  background: #fff;
  min-height: 100vh;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.section {
  margin-top: 20px;
  font-size: 14px;
  font-weight: bold;
  color: #555;
}

.input-group {
  margin-top: 10px;
}

input, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-top: 5px;
  font-size: 14px;
}

input:focus, textarea:focus {
  border-color: orange;
  outline: none;
}

.range {
  width: 100%;
}

.card {
  background: #fafafa;
  padding: 15px;
  border-radius: 15px;
  margin-top: 10px;
}

.result {
  font-size: 18px;
  font-weight: bold;
  color: #ff6a00;
}

button {
  width: 100%;
  padding: 15px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(to right, orange, #ff6a00);
  color: white;
  font-size: 16px;
  margin-top: 20px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">

<h2>Ajukan Pinjaman</h2>

<!-- DATA DIRI -->
<div class="section">Data Diri</div>
<div class="input-group">
  <input type="text" id="nama" placeholder="Nama Lengkap">
  <input type="text" id="nik" placeholder="NIK">
  <input type="email" placeholder="Email">
  <input type="text" placeholder="No HP">
  <textarea placeholder="Alamat"></textarea>
</div>

<!-- PEKERJAAN -->
<div class="section">Data Pekerjaan</div>
<div class="input-group">
  <input type="text" placeholder="Pekerjaan">
  <input type="number" id="gaji" placeholder="Penghasilan/Bulan">
</div>

<!-- PINJAMAN -->
<div class="section">Simulasi Pinjaman</div>

<div class="card">
  <label>Jumlah Pinjaman</label>
  <input type="range" min="1000000" max="50000000" step="500000" value="5000000" id="pinjaman" class="range">

  <p>Rp <span id="pinjamanValue">5.000.000</span></p>

  <label>Tenor (bulan)</label>
  <input type="range" min="1" max="24" value="6" id="tenor" class="range">
  <p><span id="tenorValue">6</span> bulan</p>

  <div class="result">
    Cicilan: Rp <span id="cicilan">0</span>/bulan
  </div>
</div>

<button onclick="submitForm()">Ajukan Sekarang</button>

</div>

<script>
const pinjaman = document.getElementById("pinjaman");
const tenor = document.getElementById("tenor");

const pinjamanValue = document.getElementById("pinjamanValue");
const tenorValue = document.getElementById("tenorValue");
const cicilan = document.getElementById("cicilan");

function formatRupiah(angka) {
  return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function hitung() {
  let p = parseInt(pinjaman.value);
  let t = parseInt(tenor.value);
  let bunga = 0.02; // 2% per bulan

  let total = p + (p * bunga * t);
  let perBulan = total / t;

  pinjamanValue.innerText = formatRupiah(p);
  tenorValue.innerText = t;
  cicilan.innerText = formatRupiah(Math.round(perBulan));
}

pinjaman.oninput = hitung;
tenor.oninput = hitung;

hitung();

function submitForm() {
  let nama = document.getElementById("nama").value;
  let nik = document.getElementById("nik").value;

  if(nama === "" || nik === ""){
    alert("Harap isi data dengan lengkap!");
    return;
  }

  alert("Pengajuan berhasil dikirim 🚀");
}
</script>

</body>
</html>
