<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jago Instan</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #ff7a00, #ff9f1c);
}

.container {
    max-width: 420px;
    margin: 40px auto;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    color: #ff7a00;
}

.header p {
    font-size: 14px;
    color: #777;
}

.section-title {
    margin-top: 20px;
    font-weight: bold;
    color: #ff7a00;
}

.input-group {
    margin-top: 10px;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #eee;
    margin-top: 5px;
    background: #fafafa;
}

.input-group input:focus,
.input-group select:focus {
    outline: none;
    border-color: #ff7a00;
    background: white;
}

.checkbox {
    margin-top: 15px;
    font-size: 13px;
}

.button {
    margin-top: 20px;
}

.button button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #ff7a00, #ff5400);
    color: white;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.button button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>JAGO INSTAN</h1>
        <p>Form Pengajuan Pinjaman</p>
    </div>

    <div class="section-title">Data Pribadi</div>

    <div class="input-group">
        <input type="text" placeholder="Nama Lengkap">
    </div>

    <div class="input-group">
        <input type="text" placeholder="Nomor KTP">
    </div>

    <div class="input-group">
        <input type="text" placeholder="Nomor HP">
    </div>

    <div class="input-group">
        <input type="email" placeholder="Email">
    </div>

    <div class="input-group">
        <input type="text" placeholder="Alamat Lengkap">
    </div>

    <div class="section-title">Detail Pinjaman</div>

    <div class="input-group">
        <select>
            <option>Jumlah Pinjaman</option>
            <option>Rp 1.000.000</option>
            <option>Rp 5.000.000</option>
            <option>Rp 10.000.000</option>
        </select>
    </div>

    <div class="input-group">
        <select>
            <option>Tenor</option>
            <option>3 Bulan</option>
            <option>6 Bulan</option>
            <option>12 Bulan</option>
        </select>
    </div>

    <div class="input-group">
        <select>
            <option>Tujuan Pinjaman</option>
            <option>Modal Usaha</option>
            <option>Kebutuhan Pribadi</option>
            <option>Pendidikan</option>
        </select>
    </div>

    <div class="checkbox">
        <input type="checkbox"> Saya setuju dengan syarat & ketentuan
    </div>

    <div class="button">
        <button>AJUKAN PINJAMAN</button>
    </div>
</div>

</body>
</html>
