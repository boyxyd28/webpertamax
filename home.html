<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fintech App</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(to bottom,#f9a825,#f57c00);
  padding:15px;
}

.page{display:none;}
.show{display:block;}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  text-align:center;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:none;
  border-radius:999px;
  background:orange;
  color:white;
}

</style>
</head>

<body>

<!-- DASHBOARD -->
<div id="dashboardPage" class="show">

  <div style="background:orange;color:white;padding:20px;border-radius:20px;">
    <h3>Selamat datang</h3>
    <div id="saldo">Rp 0</div>
  </div>

  <div class="grid">
    <div class="card" onclick="showPage('pengajuanPage')">💰<br>Pinjam</div>
    <div class="card">💸<br>Cair</div>
    <div class="card">👤<br>Profil</div>
  </div>

</div>

<!-- FORM -->
<div id="pengajuanPage" class="page">

  <div class="card">

    <h3>Form Pinjaman</h3>

    <input id="nama" placeholder="Nama">
    <input id="nik" placeholder="NIK">
    <input id="gaji" placeholder="Gaji">
    <input id="pinjam" placeholder="Jumlah Pinjaman">

    <button onclick="proses()">Ajukan</button>

  </div>

</div>

<script>

function showPage(page){
  document.getElementById("dashboardPage").classList.remove("show");
  document.getElementById("pengajuanPage").classList.remove("show");

  document.getElementById(page).classList.add("show");
}

function proses(){

  let nama = document.getElementById("nama").value;
  let gaji = parseInt(document.getElementById("gaji").value||0);

  if(!nama || !gaji){
    alert("Isi data dulu");
    return;
  }

  let limit = gaji * 5;

  localStorage.setItem("limit", limit);

  alert("Berhasil!");

  document.getElementById("saldo").innerText = "Rp " + limit;

  showPage("dashboardPage");
}

</script>

</body>
</html>
