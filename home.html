<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fintech App</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(to bottom,#f9a825,#f57c00);
  padding:20px;
}

/* HEADER */
.header{
  background:linear-gradient(to right,#f59e0b,#f97316);
  padding:20px;
  border-radius:20px;
  color:white;
  margin-bottom:20px;
}

/* GRID MENU */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
}

/* FORM */
.form-box{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h3{
  margin-bottom:15px;
  text-align:center;
}

/* INPUT */
input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ddd;
  background:#f9f9f9;
}

/* BUTTON */
button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:none;
  border-radius:999px;
  background:linear-gradient(to right,#f59e0b,#f97316);
  color:white;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<!-- DASHBOARD -->
<div id="dashboardPage" class="show">

 <div class="header">
  <div>Selamat datang</div>
  <div style="font-size:24px;font-weight:bold;">Rp 0</div>
</div>

  <div class="grid">
    <div class="card" onclick="showPage('pengajuanPage')">💰<br>Pinjam</div>
    <div class="card">💸<br>Cair</div>
    <div class="card">👤<br>Profil</div>
  </div>

</div>

<!-- FORM -->
<div id="pengajuanPage" class="page">

 <div class="form-box">
  <h3>Form Pinjaman</h3>

  <input placeholder="Nama">
  <input placeholder="NIK">
  <input placeholder="Gaji">
  <input placeholder="Jumlah Pinjaman">

  <button>Ajukan</button>
</div>
</div>

<script>

function showPage(page){
  document.getElementById("dashboardPage").classList.remove("show");
  document.getElementById("pengajuanPage").classList.remove("show");

  document.getElementById(page).classList.add("show");
}

function proses(){

  let nama = document.getElementById("nama").value;
  let gaji = parseInt(document.getElementById("gaji").value||0);

  if(!nama || !gaji){
    alert("Isi data dulu");
    return;
  }

  let limit = gaji * 5;

  localStorage.setItem("limit", limit);

  alert("Berhasil!");

  document.getElementById("saldo").innerText = "Rp " + limit;

  showPage("dashboardPage");
}

</script>

</body>
</html>
