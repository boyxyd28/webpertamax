<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom right, #f9a825, #f57c00);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 22px;
    padding: 24px 20px;
    box-shadow: 0 12px 30px rgba(0,0,0,.15);
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 12px;
    border-radius: 16px;
    background: #f59e0b;
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 28px;
  }
  h2 {
    margin: 10px 0 18px;
    color: #f97316;
    font-size: 28px;
  }
  .field {
    margin: 10px 0;
    text-align: left;
  }
  input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
  }
  input:focus {
    border-color: #f57c00;
    box-shadow: 0 0 0 3px rgba(245,124,0,.12);
  }
  .password-box {
    position: relative;
  }
  .password-box input {
    padding-right: 48px;
  }
  .eye {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    user-select: none;
    font-size: 18px;
  }
  .error {
    display: block;
    min-height: 16px;
    margin-top: 4px;
    font-size: 12px;
    color: #d11;
  }
  .hint {
    margin-top: 4px;
    font-size: 12px;
    color: #888;
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(to right, #f59e0b, #f97316);
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
  .shake { animation: shake .3s; }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">D</div>
    <h2>Masuk ke Akun</h2>

    <div class="field">
      <input type="text" id="email" placeholder="Email / No HP" autocomplete="username">
      <small class="error" id="errEmail"></small>
    </div>

    <div class="field password-box">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <span class="eye" id="eye" onclick="togglePass()">👁️</span>
      <small class="error" id="errPass"></small>
    </div>

    <div class="field">
      <input type="text" id="nik" placeholder="NIK (16 digit)" inputmode="numeric" maxlength="16" autocomplete="off">
      <small class="hint">Demo validasi. Gunakan 16 digit angka.</small>
      <small class="error" id="errNik"></small>
    </div>

    <button id="btnLogin" type="button">Masuk</button>
  </div>

  <script>
    function togglePass() {
      const input = document.getElementById("password");
      const eye = document.getElementById("eye");
      if (input.type === "password") {
        input.type = "text";
        eye.textContent = "🙈";
      } else {
        input.type = "password";
        eye.textContent = "👁️";
      }
    }

    function setError(id, text, inputEl) {
      document.getElementById(id).textContent = text;
      inputEl.classList.add("shake");
      setTimeout(() => inputEl.classList.remove("shake"), 300);
    }

    document.getElementById("btnLogin").addEventListener("click", function () {
      const emailEl = document.getElementById("email");
      const passEl = document.getElementById("password");
      const nikEl = document.getElementById("nik");

      document.getElementById("errEmail").textContent = "";
      document.getElementById("errPass").textContent = "";
      document.getElementById("errNik").textContent = "";

      let ok = true;

      const email = emailEl.value.trim();
      const pass = passEl.value;
      const nik = nikEl.value.trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const phoneRegex = /^(\+62|62|0)[0-9]{8,13}$/;

      if (!(emailRegex.test(email) || phoneRegex.test(email))) {
        setError("errEmail", "Email / No HP tidak valid", emailEl);
        ok = false;
      }

      if (pass.length < 6) {
        setError("errPass", "Password minimal 6 karakter", passEl);
        ok = false;
      }

      if (!/^[0-9]{16}$/.test(nik)) {
        setError("errNik", "NIK harus 16 digit angka", nikEl);
        ok = false;
      }

      if (!ok) return;

      this.textContent = "Memproses...";
      this.disabled = true;

      setTimeout(() => {
        window.location.href = "next.html";
      }, 1000);
    });
  </script>
</body>
</html>
