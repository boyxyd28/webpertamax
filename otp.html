<script>

// AMBIL NIK
let nik = localStorage.getItem("nik") || "";
let nomor = "+62 8**" + nik.slice(-3);
document.querySelector("p").innerText = "Kode dikirim ke " + nomor;

// INPUT OTP
let inputs = document.querySelectorAll(".otp-input input");

inputs.forEach((input, index) => {

  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");

    if(input.value && index < 5){
      inputs[index + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if(e.key === "Backspace" && !input.value && index > 0){
      inputs[index - 1].focus();
    }
  });

});

// GET OTP
function getOTP(){
  let code = "";
  inputs.forEach(input => {
    code += input.value;
  });
  return code;
}

// VERIFIKASI
function verifikasi(){

  let code = getOTP();

  if(code.length !== 6){
    alert("OTP harus 6 digit");
    return;
  }

  if(!/^[0-9]+$/.test(code)){
    alert("OTP hanya boleh angka");
    return;
  }

  document.body.innerHTML = "Memverifikasi...";

  setTimeout(function(){
    window.location.href = "home.html";
  },1000);
}

// TIMER
let time = 60;
let timerEl = document.getElementById("timer");

let countdown = setInterval(() => {
  time--;
  timerEl.innerText = "Kirim ulang dalam " + time + " detik";

  if(time <= 0){
    clearInterval(countdown);
    timerEl.innerText = "Silakan kirim ulang";
  }
}, 1000);

// RESEND
function resend(){
  time = 60;
}

</script>
