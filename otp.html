<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifikasi OTP</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to bottom right, #f9a825, #f57c00);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  color: #f97316;
}

.otp-input {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.otp-input input {
  width: 40px;
  height: 50px;
  font-size: 20px;
  text-align: center;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(to right, #f59e0b, #f97316);
  color: white;
  font-weight: bold;
}

.timer {
  margin-top: 10px;
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<div class="card">

  <h2>Verifikasi Kode</h2>
  <p>Masukkan kode OTP</p>

  <div class="otp-input">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
  </div>

  <button onclick="verifikasi()">Verifikasi</button>

  <div class="timer" id="timer">Kirim ulang dalam 60 detik</div>
  <button onclick="resend()" style="margin-top:10px;">Kirim Ulang</button>

</div>



<script>

// 🔥 AMBIL NIK
let nik = localStorage.getItem("nik") || "";
let nomor = "+62 8**" + nik.slice(-3);

// tampilkan nomor
document.querySelector("p").innerText = "Kode dikirim ke " + nomor;

// 🔥 GENERATE OTP
let otp = Math.floor(100000 + Math.random() * 900000).toString();
console.log("OTP:", otp); // 👉 tampil di console (lebih aman dari alert)

// 🔥 INPUT
let inputs = document.querySelectorAll(".otp-input input");

inputs.forEach((input, index) => {

  input.addEventListener("input", () => {

    // hanya angka
    input.value = input.value.replace(/[^0-9]/g, "");

    // auto pindah
    if(input.value && index < 5){
      inputs[index + 1].focus();
    }

  });

  // 🔥 backspace balik
  input.addEventListener("keydown", (e) => {
    if(e.key === "Backspace" && !input.value && index > 0){
      inputs[index - 1].focus();
    }
  });

});

// 🔥 AMBIL OTP
function verifikasi(){

  let code = getOTP();

  if(code.length < 6 || !/^[0-9]+$/.test(code)){
    alert("Masukkan 6 digit angka OTP");
    return;
  }

  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;">
      <div>Memverifikasi...</div>
    </div>
  `;

  setTimeout(()=>{
    window.location.href = "home.html";
  },1500);
}

// 🔥 TIMER
let time = 60;
let timerEl = document.getElementById("timer");

let countdown = setInterval(() => {
  time--;
  timerEl.innerText = "Kirim ulang dalam " + time + " detik";

  if(time <= 0){
    clearInterval(countdown);
    timerEl.innerText = "Silakan kirim ulang";
  }
}, 1000);

// 🔥 RESEND
function resend(){
  otp = Math.floor(100000 + Math.random() * 900000).toString();
  console.log("OTP baru:", otp);
  time = 60;
}

<script>

// semua kode kamu

function resend(){
  otp = Math.floor(100000 + Math.random() * 900000).toString();
  console.log("OTP baru:", otp);
  time = 60;
}

// ✅ PINDAH KE SINI
function verifikasi(){

  let code = getOTP();

  if(code.length < 6){
    alert("Masukkan 6 digit OTP");
    return;
  }

  if(code !== otp){
    alert("OTP salah!");
    return;
  }

  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
      Memverifikasi...
    </div>
  `;

  setTimeout(()=>{
    window.location.href = "home.html";
  },1000);
}

// ✅ TAMBAH INI JUGA
function getOTP(){
  let inputs = document.querySelectorAll(".otp-input input");
  let code = "";

  inputs.forEach(input => {
    code += input.value;
  });

  return code;
}

</script>
