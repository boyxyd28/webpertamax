<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verifikasi OTP</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to bottom right, #f9a825, #f57c00);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
  color: #f97316;
}

.otp-input {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.otp-input input {
  width: 40px;
  height: 50px;
  font-size: 20px;
  text-align: center;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(to right, #f59e0b, #f97316);
  color: white;
  font-weight: bold;
}

.timer {
  margin-top: 10px;
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<div class="card">

  <h2>Verifikasi Kode</h2>
  <p>Masukkan kode OTP</p>

  <div class="otp-input">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
  </div>

  <button onclick="verifikasi()">Verifikasi</button>

  <div class="timer" id="timer">Kirim ulang dalam 60 detik</div>
  <button onclick="resend()" style="margin-top:10px;">Kirim Ulang</button>

</div>

<script>

// 🔥 AMBIL DATA USER
let nik = localStorage.getItem("nik") || "";
let nomor = "+62 8**" + nik.slice(-3);

// tampilkan nomor
document.querySelector("p").innerText = "Kode dikirim ke " + nomor;

// 🔥 GENERATE OTP
let otp = Math.floor(100000 + Math.random() * 900000).toString();
alert("Kode OTP: " + otp);

// 🔥 INPUT
let inputs = document.querySelectorAll(".otp-input input");

inputs.forEach((input, index) => {
  input.addEventListener("input", () => {

    // auto pindah
    if(input.value && index < 5){
      inputs[index + 1].focus();
    }

    // 🔥 AUTO SUBMIT kalau sudah 6 digit
    if(getOTP().length === 6){
      verifikasi();
    }

  });
});

// 🔥 AMBIL OTP
function getOTP(){
  let code = "";
  inputs.forEach(i => code += i.value);
  return code;
}

// 🔥 VERIFIKASI
function verifikasi(){

 // 🔥 BYPASS OTP (biar langsung lolos)
if(getOTP().length < 6){
  alert("Masukkan 6 digit");
  return;
}
  // 🔥 LOADING FEEL
  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;">
      <div>Memverifikasi...</div>
    </div>
  `;

  setTimeout(()=>{
    localStorage.setItem("isLogin", "true");
   window.location.href = "home.html";
  },1500);
}

// 🔥 TIMER
let time = 60;
let timerEl = document.getElementById("timer");

let countdown = setInterval(() => {
  time--;
  timerEl.innerText = "Kirim ulang dalam " + time + " detik";

  if(time <= 0){
    clearInterval(countdown);
    timerEl.innerText = "Silakan kirim ulang";
  }
}, 1000);

// 🔥 RESEND
function resend(){
  otp = Math.floor(100000 + Math.random() * 900000).toString();
  alert("Kode baru: " + otp);
  time = 60;
}

</script>
