<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi OTP</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to bottom right, #f9a825, #f57c00);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 { color: #f97316; }

.otp-input {
  display: flex;
  justify-content: space-between;
  margin: 20px 0;
}

.otp-input input {
  width: 40px;
  height: 50px;
  font-size: 20px;
  text-align: center;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(to right, #f59e0b, #f97316);
  color: white;
  font-weight: bold;
}

.timer {
  margin-top: 10px;
  font-size: 13px;
  color: #666;
}
</style>
</head>

<body>

<div class="card">
  <h2>Verifikasi Kode</h2>
  <p id="info">Masukkan kode OTP</p>

  <div class="otp-input">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
    <input maxlength="1">
  </div>

  <button onclick="verifikasi()">Verifikasi</button>

  <div class="timer" id="timer">Kirim ulang dalam 60 detik</div>
  <button onclick="resend()" style="margin-top:10px;">Kirim Ulang</button>
</div>

<script>

// tampilkan nomor
let nik = localStorage.getItem("nik") || "";
let nomor = "+62 8**" + nik.slice(-3);
document.getElementById("info").innerText = "Kode dikirim ke " + nomor;

// input OTP
let inputs = document.querySelectorAll(".otp-input input");

inputs.forEach((input, index) => {

  input.addEventListener("input", () => {
    input.value = input.value.replace(/[^0-9]/g, "");
    if(input.value && index < 5){
      inputs[index + 1].focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if(e.key === "Backspace" && !input.value && index > 0){
      inputs[index - 1].focus();
    }
  });

});

// ambil OTP
function getOTP(){
  let code = "";
  inputs.forEach(input => code += input.value);
  return code;
}

// verifikasi
function verifikasi(){
  let code = getOTP();

  if(code.length !== 6){
    alert("OTP harus 6 digit");
    return;
  }

  if(!/^[0-9]+$/.test(code)){
    alert("OTP hanya boleh angka");
    return;
  }

  document.body.innerHTML = "Memverifikasi...";

  setTimeout(() => {
    window.location.href = "home.html";
  }, 1000);
}

// timer
let time = 60;
let timerEl = document.getElementById("timer");

setInterval(() => {
  time--;
  timerEl.innerText = "Kirim ulang dalam " + time + " detik";
  if(time <= 0){
    timerEl.innerText = "Silakan kirim ulang";
  }
}, 1000);

// resend
function resend(){
  time = 60;
}

</script>

</body>
</html>
